name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: |
          FILE=$(find . -name build.gradle | head -1)
          if [ -z "$FILE" ]; then
            echo "build.gradle not found! Files in repo:"
            find . -not -path './.git/*' | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Building in $DIR"
          cd "$DIR"
          gradle build
          echo "LIBS=$DIR/build/libs" >> $GITHUB_ENV

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: pricealert-mod
          path: |
            ${{ env.LIBS }}/*.jar
            !${{ env.LIBS }}/*-sources.jar
